<h1> Edit Games </h1>

<ul ui-sortable="sortableOptions" class="list-group" ng-model="games">
  <li class="list-group-item" ng-repeat="game in games">
    <span> {{game.name}} </span>

    <span class="editGameButtonGroup">
      <button ng-click="edit(game)"> Edit </button>
      <button ng-click="delete(game)"> Delete </button>
    </span>

  </li>
</ul>

<button ng-click="save()"> Save New Order </button>
