<h1> Admin Panel </h1>

<h2> Create New Game </h2>
<form ng-submit="newGame()">
	<label for="name"> Name  </label> <input type="text" name="name"ng-model="game.name">
	<label for="description"> </label> <input type="text" name="description" ng-model="game.description">
	<label for="image" Image</label><input type="text" name="image" ng-model="game.image">
	<button type="submit"> Create New Game </button>
</form>
