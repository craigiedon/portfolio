<h1> Admin Panel </h1>

<h2> Create New Game </h2>
<form ng-submit="newGame()">
    <p> Name </p> <input type="text" name="name"ng-model="game.name" /> <br />
    <p> Description </p> <textarea rows="6" cols="50" ng-model="game.description"> </textarea>  <br />

    <input type ="file" file-model="imageFile"/> <br/>
    <input type ="file" file-model="gameFile"/> <br/>
    <button type="submit" ng-enabled="submitEnabled"> Create New Game </button>

</form>
