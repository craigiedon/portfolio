<h1> Admin Panel </h1>

<div class="panel panel-primary">
    <div class="panel-heading"> Create New Game </div>
    <div class="panel-body">
	<form ng-submit="newGame()">
	    <div class="form-group">
		<label> Name </label> <input type="text" name="name"ng-model="game.name" /> <br />
	    </div>

	    <div class="form-group">
		<label> Date Created </label> <input type="text" name="dateCreated" ng-model="game.dateCreated" />
	    </div>

	    <div class="form-group">
		<p> <label> Description </label> </p> <textarea rows="6" cols="50" ng-model="game.description"> </textarea>
	    </div>

	    <div class="form-group">
		<label> Image Thumbnail </label> <input type ="file" file-model="imageFile"/> <br/>
	    </div>

	    <div class="form-group">
		<label> Play Game Link </label> <input type="text" name="name" ng-model="game.playLink" />
	    </div>

	    <div class="form-group">
		<label> Game Files </label> <input type ="file" file-model="gameFiles" multiple/>
	    </div>
	    
	    <button class="btn btn-default" type="submit" ng-enabled="submitEnabled"> Create New Game </button>

	</form>
    </div>
</div>
