<div class="panel panel-primary">
  <div class="panel-heading"> Editing {{game.name}} </div>
  <div class="panel-body">
    <form ng-submit="editGame()">
      <div class="form-group">
	<label> Name </label> <input type="text" name="name" ng-model="game.name">
      </div>

      <div class="form-group">
	<label> Date Created </label> <input type="text" name="dateCreated" ng-model="game.dateCreated" />
      </div>

      <div class="form-group">
	<p> <label> Description </label> </p> <textarea rows="6" cols="50" ng-model="game.description"> </textarea>
      </div>

      <div class="form-group">
	<label> Image </label> <br />
	<img ng-src="gameFiles/{{game.imageName}}" width="150px" height="150px">
      </div>
      
      <div class="form-group">
	<label> Play Game Link </label> <input type="text" name="name" ng-model="game.playLink" />
      </div>
      <button class="btn btn-default" type="submit" ng-enabled="submitEnabled"> Save Edits </button>

    </form>
  </div>
</div>
