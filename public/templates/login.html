<h1> Login </h1>
<form  ng-submit="login()">
    <div class="form-group">
	<label for="username"> Username </label> <input class="form-control" type="text" name="username" ng-model="user.username">
    </div>
    <div class="form-group">
	<label for="password"> Password </label> <input class="form-control" type="password" name="password" ng-model="user.password">
    </div>

    <div class="form-group">
	<button type="submit" class="btn btn-default"> Log in </button>
    </div>
</form>
