<article class="game">
    <h3> {{game.name}} </h3>
    <img width="150px" height="150px" ng-src="gameFiles/{{game.imageName}}">
    <h4> {{game.dateCreated}} </h4>
    
    <p> {{game.description}} </p>
    
    <div>
	<a href={{game.playLink}}> Play {{game.name}} </a>
    </div>
    
    <div>
	<a href="#/games/"> Back </a>
    </div>
</article>
