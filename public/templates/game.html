<article class="game">
    <h2> {{game.name}} </h2>
    <h4> {{game.dateCreated}} </h4>
    <img width="150px" height="150px" ng-src="gameFiles/{{game.imageName}}">

    <md ng-model="game.description"></md>
    
    <div>
	<a class="majorLink" href={{game.playLink}}> Play {{game.name}} </a>
    </div>
    
    <div>
	<a class="majorLink" href="#/games/"> Back </a>
    </div>
</article>
